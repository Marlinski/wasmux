[package]
name = "wasmux-cli"
description = "Run a wasmux sandbox from a terminal: a shell, a command, or the test corpus."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "wasmux"

[[bin]]
name = "wasmux"
path = "src/main.rs"

# The benchmark, likewise built for whatever backend is selected.
[[bin]]
name = "wasmux-bench"
path = "src/bin/wasmux-bench.rs"

# Runs the behaviour corpus wherever it is built. Under wasmtime this is the only thing that
# exercises the compiled-in backend against the same table the host tests use.
[[bin]]
name = "wasmux-corpus"
path = "src/bin/wasmux-corpus.rs"

# The backend is chosen the same way a consumer chooses it, by feature, so building the CLI
# for wasm32 exercises exactly what an integrator gets.
[features]
default = ["aot", "interp", "tty"]
aot = ["wasmux/aot"]
interp = ["wasmux/interp"]
# A terminal for an interactive session. On here because this binary's whole job is to be the
# thing a person types at; a library consumer decides separately, and gets it off by default.
tty = ["wasmux/tty", "dep:libc"]

[dependencies]
wasmux = { workspace = true, features = ["host-vfs", "corpus"] }

# Only to put this process's own terminal into raw mode when the guest asks for it: there is
# no other way to reach `tcsetattr`, and the library itself stays dependency-free. Unix only,
# because that is where a terminal is; the wasm32 build of this CLI has none.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }
